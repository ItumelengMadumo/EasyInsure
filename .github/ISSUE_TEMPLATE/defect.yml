name: EasyInsure defect
description: Reproducible non-production defect.
title: "EI-####: "
labels: ["type:defect", "status:triage"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [local, dev, Staging, production]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence and correlation IDs
  - type: textarea
    id: regression
    attributes:
      label: Regression test and rollback
    validations:
      required: true
