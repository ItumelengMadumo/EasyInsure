name: Production gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  release-source:
    name: Verify Staging release source
    if: github.head_ref == 'Staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Confirm release contains Staging exactly
        run: |
          git fetch origin Staging main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/Staging)"
      - name: Production release summary
        run: |
          echo "### Production gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source branch: Staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment requires the protected Production environment." >> "$GITHUB_STEP_SUMMARY"
